[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "itsm-insights"
version = "0.1.0"
description = "SLA, MTTR and service-desk analytics from a ticket CSV export, in one command."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Syed Musa Raza Naqvi" }]
keywords = ["itsm", "sla", "service-desk", "mttr", "analytics", "helpdesk"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "pandas>=2.2",
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rich>=13.0",
    "tzdata",  # IANA timezones on Windows, where the OS has none
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
itsm-insights = "itsm_insights.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/itsm_insights"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
